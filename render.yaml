# Blueprint Render â€” https://render.com/docs/blueprint-spec
# Web Service Docker (Vue SPA + API Laravel) + PostgreSQL (free)

databases:
  - name: rdp-db-frankfurt
    plan: free
    region: frankfurt
    databaseName: rdp
    user: rdp

services:
  - type: web
    name: rdp-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Ø§Ù„Ø±Ø§Ø¨Ø·Ø© Ø§Ù„Ø³ÙˆØ¯Ø§Ù†ÙŠØ© Ø¨Ø±ÙŠÙ†
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Optionnel : si vide, entrypoint gÃ©nÃ¨re une clÃ© au boot.
      # Pour la stabilitÃ© (sessions), dÃ©finissez APP_KEY dans le dashboard Render.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: rdp-db-frankfurt
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      # Seeders are additive: they MUST NOT overwrite officer/deputy cards.
      # All user uploads (officer cards, news, albums, events, announcements,
      # media-center, shura photos, external docs) live in Postgres
      # (department_card_photos + stored_files), not the container disk.
      # Render free has no persistent disk, so /storage is wiped on every deploy.
      # Do not add AWS/S3 unless already configured.
      # true = skip rdp:ensure-admin (roles + Super Admin) after a stable prod.
      - key: SKIP_SEEDERS
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      # Mot de passe admin : Ã  dÃ©finir uniquement dans le dashboard Render (jamais dans git)
      - key: ADMIN_PASSWORD
        sync: false
      # URL publique (liens reset password)
      - key: APP_URL
        value: https://aso-soudan.onrender.com
      - key: FRONTEND_URL
        value: https://aso-soudan.onrender.com
      # MailerSend HTTP API (SMTP 587 timeout sur Render free)
      - key: MAIL_MAILER
        value: mailersend
      - key: MAILERSEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Rabta ACS Rennes
      - key: CONTACT_EMAIL
        value: hima171221@gmail.com

