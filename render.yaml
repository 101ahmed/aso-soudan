# Blueprint Render — https://render.com/docs/blueprint-spec
# Web Service Docker (Vue SPA + API Laravel) + PostgreSQL (free)

databases:
  - name: rdp-db
    plan: free
    region: frankfurt
    databaseName: rdp
    user: rdp

services:
  - type: web
    name: rdp-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: رابطة الجالية السودانية برين
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Optionnel : si vide, entrypoint génère une clé au boot.
      # Pour la stabilité (sessions), définissez APP_KEY dans le dashboard Render.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: rdp-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      # true = ne pas reseeder (après prod stable)
      - key: SKIP_SEEDERS
        value: "false"
      - key: ADMIN_EMAIL
        value: admin@acs-rennes.fr
      - key: ADMIN_PASSWORD
        value: Password123!
      # URL publique (liens reset password)
      - key: APP_URL
        value: https://aso-soudan.onrender.com
      - key: FRONTEND_URL
        value: https://aso-soudan.onrender.com
      # SMTP MailerSend : à définir dans le dashboard Render (Environment).
      # Tant que MAIL_MAILER=log (défaut Laravel), aucun email n'arrive en boîte.
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Rabta ACS Rennes
